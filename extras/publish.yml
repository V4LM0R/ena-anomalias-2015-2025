# ALTERNATIVA a docs/: compilar el sitio con GitHub Actions y publicarlo en la rama gh-pages.
# Para usarla: copiar este archivo a .github/workflows/publish.yml, quitar "output-dir: docs"
# de _quarto.yml, borrar docs/ y en Settings > Pages elegir la rama gh-pages.
on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
